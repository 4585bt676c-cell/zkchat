<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-color-theme="gold">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>jinnyore的小花园</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
*::-webkit-scrollbar{display:none;width:0}
html{max-width:100vw}
body{font-family:"Noto Serif SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow:hidden;transition:background .5s,color .5s}
::selection{background:rgba(var(--accent-rgb),.2);color:var(--text)}

:root{
  --accent:#c5a47e;--accent-rgb:197,164,126;
  --bg:#080810;--bg2:rgba(18,18,30,.92);--bg3:rgba(28,28,48,.6);
  --text:#e8e4dc;--text2:#989890;--text3:#5a5a6a;
  --border:rgba(255,255,255,.04);--border2:rgba(255,255,255,.08);
  --card-bg:rgba(255,255,255,.02);--card-hover:rgba(255,255,255,.05);
  --msg-me-bg:linear-gradient(135deg,rgba(var(--accent-rgb),.85),rgba(var(--accent-rgb),.6));--msg-me-text:#fff;
  --msg-partner-bg:rgba(255,255,255,.04);--msg-partner-text:var(--text);
  --shadow:0 4px 24px rgba(0,0,0,.3);--radius:18px;--radius-sm:12px;
  --font-size:15px;--transition:all .3s cubic-bezier(.4,0,.2,1);
}
html[data-theme="light"]{
  --bg:#f5f2ed;--bg2:rgba(255,255,255,.9);--bg3:rgba(245,242,237,.8);
  --text:#2a2824;--text2:#88847e;--text3:#bab5ad;
  --border:rgba(0,0,0,.05);--border2:rgba(0,0,0,.08);
  --card-bg:rgba(0,0,0,.015);--card-hover:rgba(0,0,0,.03);
  --msg-me-bg:linear-gradient(135deg,rgba(var(--accent-rgb),.9),rgba(var(--accent-rgb),.7));
  --msg-partner-bg:#fff;
  --shadow:0 2px 16px rgba(0,0,0,.04);
}
html[data-color-theme="gold"]{--accent:#c5a47e;--accent-rgb:197,164,126}
html[data-color-theme="blue"]{--accent:#7FA6CD;--accent-rgb:127,166,205}
html[data-color-theme="purple"]{--accent:#BB9EC7;--accent-rgb:187,158,199}
html[data-color-theme="pink"]{--accent:#F4A6B3;--accent-rgb:244,166,179}
html[data-color-theme="mono"]{--accent:#888;--accent-rgb:136,136,136}
html[data-color-theme="sunset"]{--accent:#FF9A8B;--accent-rgb:255,154,139}

.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.stars span{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3s infinite alternate}
@keyframes twinkle{0%{opacity:.15;transform:scale(1)}100%{opacity:.85;transform:scale(1.3)}}
.glow-1,.glow-2{position:fixed;pointer-events:none;z-index:0;border-radius:50%}
.glow-1{width:600px;height:600px;background:radial-gradient(circle,rgba(var(--accent-rgb),.08) 0%,transparent 65%);top:10%;left:50%;transform:translateX(-50%)}
.glow-2{width:400px;height:400px;background:radial-gradient(circle,rgba(var(--accent-rgb),.05) 0%,transparent 65%);bottom:10%;right:5%}

.app{position:relative;z-index:1;display:flex;height:100dvh;overflow:hidden}
.sidebar{width:60px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;transition:width .3s;z-index:20}
.nav-item{width:48px;height:48px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:10px;color:var(--text3);transition:var(--transition);border:1px solid transparent;position:relative}
.nav-item:hover{background:var(--card-hover);color:var(--text);transform:translateY(-1px)}
.nav-item.active{background:rgba(var(--accent-rgb),.15);color:var(--accent);border-color:rgba(var(--accent-rgb),.25);box-shadow:0 0 20px rgba(var(--accent-rgb),.1)}
.nav-item .nav-icon{font-size:20px;line-height:1}
.nav-item .nav-badge{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:#e74c3c;display:none}
.nav-item .nav-badge.show{display:block}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--border);z-index:10;flex-shrink:0;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.header-avatar{width:38px;height:38px;border-radius:50%;background:rgba(var(--accent-rgb),.2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.header-info{flex:1;min-width:0;cursor:pointer;position:relative}
.header-name{font-size:15px;font-weight:600;color:var(--text)}
.header-name::after{content:' ▾';font-size:10px;color:var(--text3)}
.header-status{font-size:11px;color:var(--accent);display:flex;align-items:center;gap:4px}
.header-status::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.header-actions{display:flex;gap:4px}
.header-actions button{width:34px;height:34px;border-radius:50%;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:14px;transition:var(--transition);display:flex;align-items:center;justify-content:center}
.header-actions button:hover{border-color:rgba(var(--accent-rgb),.4);color:var(--accent)}

.char-dropdown{position:absolute;top:100%;left:0;margin-top:6px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-sm);min-width:180px;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:50;display:none;overflow:hidden}
.char-dropdown.open{display:block}
.char-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:var(--transition);font-size:14px;color:var(--text);border-bottom:1px solid var(--border)}
.char-item:hover{background:var(--card-hover)}
.char-item.active{background:rgba(var(--accent-rgb),.1);color:var(--accent)}
.char-item-dot{width:28px;height:28px;border-radius:50%;background:rgba(var(--accent-rgb),.2);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.char-item-add{border-bottom:none;color:var(--text3);font-size:13px;justify-content:center}
.char-item-add:hover{color:var(--accent)}
.char-item-del{width:24px;height:24px;border-radius:50%;border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:12px;margin-left:auto;display:none;align-items:center;justify-content:center}
.char-item:hover .char-item-del{display:flex}
.char-item-del:hover{color:#e55;background:rgba(220,60,60,.1)}

.chat-area{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:8px;position:relative}
.msg-row{display:flex;gap:8px;max-width:85%;animation:msgIn .3s ease}
.msg-row.me{align-self:flex-end;flex-direction:row-reverse}
.msg-row.partner{align-self:flex-start}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.msg-row.me .msg-avatar{background:rgba(var(--accent-rgb),.3)}
.msg-row.partner .msg-avatar{background:rgba(255,255,255,.1)}
.msg-bubble{max-width:100%;padding:12px 16px;border-radius:20px;font-size:var(--font-size);line-height:1.65;word-break:break-word;position:relative;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.msg-row.me .msg-bubble{background:var(--msg-me-bg);color:var(--msg-me-text);border-bottom-right-radius:6px;box-shadow:0 4px 15px rgba(var(--accent-rgb),.2)}
.msg-row.partner .msg-bubble{background:var(--msg-partner-bg);color:var(--msg-partner-text);border:1px solid var(--border);border-bottom-left-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.msg-row .msg-time{font-size:10px;color:var(--text3);margin-top:2px;padding:0 4px}
.msg-row.me .msg-time{text-align:right}
.msg-quote-block{background:rgba(var(--accent-rgb),.06);border-left:3px solid rgba(var(--accent-rgb),.4);padding:5px 10px;margin-bottom:6px;border-radius:0 6px 6px 0;font-size:12px;color:var(--text2);white-space:pre-wrap;max-height:50px;overflow:hidden}
.msg-img{max-width:200px;max-height:200px;border-radius:12px;cursor:pointer;transition:var(--transition)}
.msg-img:hover{transform:scale(1.02)}
.msg-emoji-large{font-size:var(--font-size);line-height:1.5}

.typing-indicator{display:flex;align-items:center;gap:4px;padding:8px 16px;color:var(--text3);font-size:12px;align-self:flex-start}
.typing-dots{display:flex;gap:3px}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:typingBounce 1.4s infinite ease-in-out}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,80%,100%{transform:scale(1);opacity:.3}40%{transform:scale(1.3);opacity:1}}

.input-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;z-index:10;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.input-bar button{width:40px;height:40px;border-radius:50%;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:17px;transition:var(--transition);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.input-bar button:hover{border-color:rgba(var(--accent-rgb),.5);color:var(--accent);transform:scale(1.05);box-shadow:0 4px 12px rgba(var(--accent-rgb),.15)}
.input-wrap{flex:1;position:relative}
.input-wrap textarea{width:100%;padding:9px 14px;border-radius:24px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:14px;font-family:inherit;outline:none;resize:none;max-height:100px;line-height:1.5;transition:var(--transition)}
.input-wrap textarea:focus{border-color:rgba(var(--accent-rgb),.5);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.08)}
.send-btn{width:40px!important;height:40px!important;background:rgba(var(--accent-rgb),.8)!important;color:#fff!important;border:none!important;font-size:18px!important}
.send-btn:hover{background:rgba(var(--accent-rgb),1)!important}

.emoji-panel{position:absolute;bottom:60px;left:0;right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius) var(--radius) 0 0;z-index:30;display:none;max-height:320px;overflow:hidden;flex-direction:column;box-shadow:0 -4px 20px rgba(0,0,0,.3)}
.emoji-panel.open{display:flex}
.emoji-tabs{display:flex;border-bottom:1px solid var(--border)}
.emoji-tab{flex:1;padding:10px;text-align:center;font-size:13px;color:var(--text2);cursor:pointer;transition:var(--transition);border-bottom:2px solid transparent}
.emoji-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.emoji-content{flex:1;overflow-y:auto;padding:12px}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}
.emoji-item{padding:6px 3px;border-radius:8px;cursor:pointer;text-align:center;font-size:13px;transition:var(--transition);border:1px solid transparent;line-height:1.3}
.emoji-item:hover{background:var(--card-hover);border-color:var(--border2)}
.emoji-item.emoji-image{padding:4px}
.emoji-item img{width:56px;height:56px;object-fit:contain;border-radius:6px}
.emoji-item .emoji-del{position:absolute;top:0;right:0;width:18px;height:18px;border-radius:50%;background:rgba(255,0,0,.7);color:#fff;font-size:10px;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.emoji-item:hover .emoji-del{display:flex}
.emoji-add{display:flex;align-items:center;justify-content:center;border:1px dashed var(--border2);color:var(--text3);font-size:24px;min-height:56px}
.emoji-add:hover{border-color:rgba(var(--accent-rgb),.4);color:var(--accent)}

.overlay{position:fixed;inset:0;z-index:998;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.open{opacity:1;pointer-events:all}
.panel{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:24px;width:min(400px,92vw);max-height:82vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px)}
.panel h3{font-size:17px;margin-bottom:16px;color:var(--text)}
.panel label{display:block;font-size:12px;color:var(--text3);margin-bottom:4px;margin-top:10px}
.panel input[type="text"],.panel select,.panel input[type="number"]{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:14px;font-family:inherit;outline:none;margin-bottom:6px}
.panel input:focus,.panel select:focus{border-color:rgba(var(--accent-rgb),.5)}

.btn{padding:7px 16px;border-radius:50px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;transition:var(--transition);white-space:nowrap}
.btn:hover{border-color:rgba(var(--accent-rgb),.4);color:var(--accent)}
.btn-accent{background:rgba(var(--accent-rgb),.8);color:#fff;border:none}
.btn-accent:hover{background:rgba(var(--accent-rgb),1)}
.btn-danger{border-color:rgba(220,60,60,.3);color:#e55}
.btn-danger:hover{background:rgba(220,60,60,.15)}
.btn-sm{padding:4px 12px;font-size:11px}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:1000;padding:10px 24px;border-radius:50px;background:rgba(var(--accent-rgb),.9);color:#fff;font-size:14px;font-family:inherit;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
.delay-row{display:flex;gap:8px;align-items:center}
.delay-row input{width:80px!important;margin-bottom:0!important}
.delay-row select{width:70px!important;margin-bottom:0!important}
.redpack-overlay .open,.call-overlay.open,.moments-overlay.open{display:flex!important}
.call-bubble{background:rgba(255,255,255,.06);border:1px solid var(--border2);border-radius:16px;padding:10px 16px;max-width:260px;text-align:center;font-size:14px;color:var(--text);animation:fadeInUp .5s ease;margin:6px 0}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.scroll-bottom{position:absolute;bottom:80px;right:20px;width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);cursor:pointer;font-size:14px;display:none;align-items:center;justify-content:center;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.scroll-bottom.show{display:flex}
.empty-chat{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:12px;font-size:14px}
.empty-chat .empty-icon{font-size:56px;opacity:.3}
.img-preview-overlay{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;cursor:pointer}
.img-preview-overlay img{max-width:90vw;max-height:90vh;border-radius:12px}
@media(max-width:768px){
  .sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%!important;height:56px;flex-direction:row;justify-content:space-around;padding:0 8px;gap:0;background:var(--bg2);border-right:none;border-top:1px solid var(--border);z-index:100}
  .nav-item{width:auto;height:44px;flex:1;font-size:9px;border-radius:8px;gap:1px}
  .nav-item .nav-icon{font-size:18px}
  .main{padding-bottom:56px}
  .header{padding:10px 12px}
  .chat-area{padding:12px}
  .msg-row{max-width:90%}
  .input-bar{padding:8px 10px;gap:6px}
  .input-bar button{width:34px;height:34px;font-size:14px}
  .send-btn{width:34px!important;height:34px!important}
  .panel{width:95vw!important;max-height:85vh;padding:16px}
  .emoji-panel{max-height:260px;bottom:120px}
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="glow-1"></div>
<div class="glow-2"></div>
<div class="toast" id="toast"></div>
<div class="img-preview-overlay" id="img-preview" onclick="this.style.display='none'"><img id="img-preview-img" src=""></div>

<div class="overlay" id="settings-overlay"><div class="panel" id="settings-panel"></div></div>
<div class="overlay" id="mail-overlay"><div class="panel" id="mail-panel"></div></div>
<div class="overlay" id="survey-overlay"><div class="panel" id="survey-panel"></div></div>
<div class="overlay" id="import-overlay"><div class="panel" id="import-panel"></div></div>

<div class="overlay" id="redpack-overlay" style="z-index:1000;align-items:center;justify-content:center"><div id="redpack-card" style="width:280px;background:linear-gradient(180deg,#e6392e,#c0392b);border-radius:20px;padding:32px 24px;text-align:center;color:#ffd700;box-shadow:0 20px 60px rgba(230,57,46,.4)"></div></div>

<div class="call-overlay" id="call-overlay" style="position:fixed;inset:0;z-index:1000;background:linear-gradient(180deg,#1a1a2e,#0a0a14);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px">
  <div id="call-avatar" style="width:80px;height:80px;border-radius:50%;background:rgba(197,164,126,.3);display:flex;align-items:center;justify-content:center;font-size:36px">✦</div>
  <div id="call-name" style="font-size:20px;font-weight:600;color:#e8e4dc">梦角</div>
  <div id="call-status" style="font-size:14px;color:#c5a47e">呼叫中…</div>
  <div id="call-timer" style="font-size:16px;color:#5a5a6a;font-family:monospace;display:none">00:00</div>
  <div id="call-bubbles" style="max-width:280px"></div>
  <div class="call-actions" style="display:flex;gap:16px;align-items:center">
    <button id="call-minimize-btn" onclick="document.getElementById('call-overlay').classList.remove('open');document.getElementById('call-minibar').style.display='flex'" style="width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer">─</button>
    <button id="call-hangup-btn" onclick="callActive=false;clearInterval(callTimer);clearInterval(callBubbleInterval);document.getElementById('call-overlay').classList.remove('open');document.getElementById('call-minibar').style.display='none'" style="width:56px;height:56px;border-radius:50%;border:none;background:#e74c3c;color:#fff;font-size:24px;cursor:pointer">📞</button>
    <button id="call-close-btn" onclick="callActive=false;clearInterval(callTimer);clearInterval(callBubbleInterval);document.getElementById('call-overlay').classList.remove('open')" style="position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.6);font-size:16px;cursor:pointer">✕</button>
  </div>
</div>

<!-- Call minimized bar -->
<div id="call-minibar" onclick="document.getElementById('call-overlay').classList.add('open');this.style.display='none'" style="position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:1001;background:var(--bg2);border:1px solid var(--border2);border-radius:24px;padding:8px 16px;display:none;align-items:center;gap:10px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.4)">
  <span id="cm-avatar" style="font-size:14px">✦</span>
  <span id="cm-info" style="font-size:12px;color:var(--text)">通话中</span>
  <button onclick="event.stopPropagation();callActive=false;clearInterval(callTimer);clearInterval(callBubbleInterval);document.getElementById('call-overlay').classList.remove('open');this.parentElement.style.display='none'" style="width:28px;height:28px;border-radius:50%;background:#e74c3c;color:#fff;border:none;font-size:12px;cursor:pointer">📞</button>
</div>

<div class="moments-overlay" id="moments-overlay" style="position:fixed;inset:0;z-index:999;background:var(--bg);display:none;flex-direction:column">
  <div class="moments-header" style="display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--bg2);border-bottom:1px solid var(--border)"><button id="moments-back-btn" style="width:34px;height:34px;border-radius:50%;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:14px">←</button><span style="font-size:17px;font-weight:600;color:var(--text);flex:1;text-align:center">朋友圈</span><span style="width:34px"></span></div>
  <div class="moments-body" id="moments-body" style="flex:1;overflow-y:auto;padding:12px 16px"></div>
  <div class="moments-compose" style="padding:10px 16px;background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center">
    <button id="moments-img-btn" style="width:38px;height:38px;border-radius:50%;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:16px">🖼️</button>
    <input type="file" id="moments-img-input" accept="image/*" style="display:none">

<script>
const GROUPS = [{"name": "默认", "color": "#888", "items": []}];

let currentGroup=null;
let characters=[];
let activeCharId=null;
let settings={theme:"auto",color:"gold",myName:"我",chatBg:""};
let customEmojis=[];
let emojiPanelOpen=false;
let replyTimer=null;
let toastTimer=null;
let proactiveTimer=null;
let callActive=false;
let callTimer=null,callSeconds=0,callBubbleInterval=null;
let incomingCallTimer=null;

function $(id){return document.getElementById(id);}
function toast(msg){var el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove("show");},1500);}
function timeStr(ts){var d=new Date(ts);return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0");}
function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function getActiveChar(){for(var i=0;i<characters.length;i++){if(characters[i].id===activeCharId)return characters[i];}return null;}
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

function compressImage(dataUrl,maxW,maxH,quality,callback){
  if(!maxW)maxW=300;if(!maxH)maxH=300;
  if(!quality&&quality!==0)quality=0.7;
  if(typeof quality==="function"){callback=quality;quality=0.7;}
  var img=new Image();
  img.onload=function(){
    var w=img.width,h=img.height;
    if(w<=maxW&&h<=maxH){callback(dataUrl);return;}
    var ratio=Math.min(maxW/w,maxH/h);
    var c=document.createElement("canvas");c.width=w*ratio;c.height=h*ratio;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    callback(c.toDataURL("image/jpeg",quality));
  };
  img.onerror=function(){callback(dataUrl);};
  img.src=dataUrl;
}

var db=null;
function openDB(cb){
  var req=indexedDB.open("zkchat",1);
  req.onupgradeneeded=function(e){e.target.result.createObjectStore("data");};
  req.onsuccess=function(e){db=e.target.result;if(cb)cb();};
  req.onerror=function(){db=null;if(cb)cb();};
}
function dbSet(key,val,cb){
  if(!db){if(cb)cb();return;}
  try{var tx=db.transaction("data","readwrite");tx.objectStore("data").put(val,key);tx.oncomplete=function(){if(cb)cb();};tx.onerror=function(){toast("存储空间不足，请清理数据");if(cb)cb();};}catch(e){if(cb)cb();}
}
function dbGet(key,cb){
  if(!db){try{cb(JSON.parse(localStorage.getItem(key)||"null"));}catch(e){cb(null);}return;}
  try{var tx=db.transaction("data","readonly");var req=tx.objectStore("data").get(key);
    req.onsuccess=function(){if(req.result!==undefined)cb(req.result);else{try{cb(JSON.parse(localStorage.getItem(key)||"null"));}catch(e){cb(null);}}};
    req.onerror=function(){try{cb(JSON.parse(localStorage.getItem(key)||"null"));}catch(e){cb(null);}};
  }catch(e){try{cb(JSON.parse(localStorage.getItem(key)||"null"));}catch(e2){cb(null);}};
}
function saveAll(){
  localStorage.setItem("zk-active-char",JSON.stringify(activeCharId));
  localStorage.setItem("zk-chat-settings",JSON.stringify(settings));
  dbSet("zk-characters",characters);
  dbSet("zk-emoji-library",customEmojis);
}

function init(){
  bindEvents();
  openDB(function(){
    loadAll(function(){
      generateStars();
      renderChat();
      applyTheme();
      applyColor();
      applyChatBg();
      updateHeader();
      updateMailBadge();
      checkPendingReplies();
      startProactiveEvents();
    });
  });
}
function loadAll(cb){
  dbGet("zk-characters",function(ch){
    characters=ch||[];
    if(characters.length===0){
      try{var oh=JSON.parse(localStorage.getItem("zk-chat-history")||"[]");var os=JSON.parse(localStorage.getItem("zk-chat-settings")||"{}");
        if(oh.length>0||os.partnerName){characters.push({id:Date.now(),name:os.partnerName||"梦角",replyGroup:os.replyGroup||"",replyDelay:os.replyDelay||3,replyUnit:os.replyUnit||"s",chatHistory:oh});}}catch(e){}
    }
    if(characters.length===0){characters.push({id:Date.now(),name:"梦角",replyGroup:"",replyDelay:3,replyUnit:"s",chatHistory:[]});}
    var hasGroup=false;for(var i=0;i<characters.length;i++){if(characters[i].isGroup)hasGroup=true;}
    if(!hasGroup){characters.push({id:"group",name:"群聊",replyGroup:"",replyDelay:3,replyUnit:"s",chatHistory:[],isGroup:true,members:[]});}
    try{activeCharId=JSON.parse(localStorage.getItem("zk-active-char"));}catch(e){activeCharId=null;}
    if(!activeCharId||!getActiveChar())activeCharId=characters[0].id;
    try{var s=JSON.parse(localStorage.getItem("zk-chat-settings")||"{}");if(s.theme)settings.theme=s.theme;if(s.color)settings.color=s.color;if(s.myName)settings.myName=s.myName;if(s.chatBg!==undefined)settings.chatBg=s.chatBg;}catch(e){}
    dbGet("zk-emoji-library",function(em){customEmojis=em||[];});
    try{var cd=JSON.parse(localStorage.getItem("zk-card-data")||"null");if(cd){GROUPS.length=0;for(var i=0;i<cd.length;i++)GROUPS.push(cd[i]);}}catch(e){}
    if(cb)cb();
  });
}
function generateStars(){
  var c=$("stars"),f=document.createDocumentFragment();
  for(var i=0;i<80;i++){var s=document.createElement("span");s.style.cssText="left:"+Math.random()*100+"%;top:"+Math.random()*100+"%;width:"+(1+Math.random()*2)+"px;height:"+(1+Math.random()*2)+"px;animation-delay:"+Math.random()*5+"s;animation-duration:"+(2+Math.random()*4)+"s";f.appendChild(s);}
  c.appendChild(f);
}
function applyTheme(){
  var actual=settings.theme;
  if(actual==="auto")actual=window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  document.documentElement.setAttribute("data-theme",actual);
}
function applyColor(){document.documentElement.setAttribute("data-color-theme",settings.color);}
function applyChatBg(){
  var area=$("chat-area");if(!area)return;
  if(settings.chatBg){
    if(settings.chatBg.startsWith("data:")||settings.chatBg.startsWith("http")){area.style.backgroundImage="url("+settings.chatBg+")";area.style.backgroundSize="cover";area.style.backgroundPosition="center";area.style.background="";}
    else{area.style.background=settings.chatBg;area.style.backgroundImage="none";}
  }else{area.style.background="";area.style.backgroundImage="none";}
}
function updateHeader(){
  var c=getActiveChar();
  $("header-name").textContent=c?c.name:"梦角";
  if(c&&c.isGroup){$("header-avatar").innerHTML='<span style="font-size:20px">👥</span>';$("header-status").textContent=(c.members||[]).length+"人在线";}
  else{$("header-avatar").textContent=c?c.name.charAt(0):"✦";$("header-status").textContent="在线";}
}

function renderChat(){
  var area=$("chat-area"),empty=$("empty-chat"),scrollBtn=$("scroll-bottom-btn");
  var children=area.children;
  for(var i=children.length-1;i>=0;i--){if(children[i]!==empty&&children[i]!==scrollBtn)area.removeChild(children[i]);}
  var ch=getActiveChar();var chatHistory=ch?ch.chatHistory:[];
  if(chatHistory.length===0){empty.style.display="flex";scrollBtn.classList.remove("show");return;}
  empty.style.display="none";
  var frag=document.createDocumentFragment();
  for(var i=0;i<chatHistory.length;i++){
    var m=chatHistory[i],row=document.createElement("div");
    row.className="msg-row "+(m.sender==="me"?"me":"partner");
    var c=getActiveChar();
    var isMe=m.sender==="me";
    var sName=isMe?(settings.myName||"我"):(m.sender==="partner"?(c?c.name:"?"):m.sender);
    var avatarHtml='<div class="msg-avatar" title="'+sName+'">'+sName.charAt(0)+'</div>';
    var bubbleHtml="";
    if(m.type==="text"){
      var tc=m.content;
      if(tc.indexOf("> "+(settings.myName||"我")+": ")>-1||tc.indexOf("> "+((c?c.name:"")||"对方")+": ")>-1){
        var lines=tc.split("\n"),qp="",rp="";
        for(var li=0;li<lines.length;li++){
          if(lines[li].indexOf("> "+(settings.myName||"我")+": ")>-1||lines[li].indexOf("> "+((c?c.name:"")||"对方")+": ")>-1)qp+=lines[li].replace(/^> /,"")+"\n";
          else if(lines[li].trim())rp+=lines[li]+"\n";
        }
        if(qp)bubbleHtml='<div class="msg-bubble"><div class="msg-quote-block">'+escapeHtml(qp.trim())+'</div>'+escapeHtml(rp.trim())+'</div>';
        else bubbleHtml='<div class="msg-bubble">'+escapeHtml(tc)+'</div>';
      }else{bubbleHtml='<div class="msg-bubble">'+escapeHtml(tc)+'</div>';}
    }else if(m.type==="image"){
      bubbleHtml='<div class="msg-img-wrap"><img class="msg-img" src="'+m.content+'" loading="lazy" onclick="previewImage(this.src)"></div>';
    }else if(m.type==="emoji"){
      if(m.content.startsWith("data:"))bubbleHtml='<div class="msg-img-wrap"><img class="msg-img" src="'+m.content+'" loading="lazy" onclick="previewImage(this.src)" style="max-width:120px;max-height:120px"></div>';
      else bubbleHtml='<div class="msg-emoji-large">'+m.content+'</div>';
    }else if(m.type==="redpack"){
      if(m.status==="pending"&&m.sender==="partner"){
        bubbleHtml='<div class="msg-bubble" style="background:linear-gradient(135deg,#e6392e,#c0392b);color:#ffd700;min-width:160px;text-align:center"><div style="font-size:28px;margin-bottom:4px">🧧</div>'+escapeHtml((c?c.name:"")+" 的红包")+'<div style="font-size:20px;font-weight:700;margin:6px 0">¥'+escapeHtml(m.content)+'</div><div style="display:flex;gap:6px;justify-content:center;margin-top:8px"><button class="rp-accept-btn" data-rid="'+m.id+'" style="padding:5px 16px;border-radius:12px;border:none;background:#ffd700;color:#c0392b;font-weight:700;cursor:pointer;font-size:13px">收下</button><button class="rp-reject-btn" data-rid="'+m.id+'" style="padding:5px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#ffcccb;cursor:pointer;font-size:12px">拒绝</button></div></div>';
      }else if(m.status==="accepted")bubbleHtml='<div class="msg-bubble">🧧 红包 ¥'+escapeHtml(m.content)+' 已收下~ '+escapeHtml(m.reply||"")+'</div>';
      else if(m.status==="rejected")bubbleHtml='<div class="msg-bubble" style="opacity:.6">🧧 红包 ¥'+escapeHtml(m.content)+' 已退还</div>';
      else bubbleHtml='<div class="msg-bubble">🧧 红包 ¥'+escapeHtml(m.content)+'</div>';
    }else if(m.type==="survey"){
      bubbleHtml='<div class="msg-bubble">'+renderSurveyInChat(m,c)+'</div>';
    }
    row.innerHTML=avatarHtml+bubbleHtml+'<div class="msg-time">'+timeStr(m.time)+'</div>';
    frag.appendChild(row);
  }
  area.insertBefore(frag,empty.nextSibling||null);
  scrollToBottom();
}
function scrollToBottom(){var area=$("chat-area");setTimeout(function(){area.scrollTop=area.scrollHeight;},50);}
function addMessage(type,content,sender){
  var c=getActiveChar();if(!c)return;
  c.chatHistory.push({id:Date.now(),type:type,content:content,sender:sender,time:Date.now()});
  saveAll();renderChat();
}
function showTyping(who){
  var area=$("chat-area"),empty=$("empty-chat");
  if(empty.style.display!=="none")empty.style.display="none";
  var name=who?who.name:((getActiveChar()||{}).name||"对方");
  var div=document.createElement("div");div.className="typing-indicator";div.id="typing-indicator";
  div.innerHTML='<span style="font-size:11px">'+name+' 正在输入</span><div class="typing-dots"><span></span><span></span><span></span></div>';
  area.appendChild(div);scrollToBottom();
}
function hideTyping(){var el=document.getElementById("typing-indicator");if(el)el.remove();}
function previewImage(src){$("img-preview-img").src=src;$("img-preview").style.display="flex";}

function getRandomCard(){
  var c=getActiveChar(),pool=[];
  var rg=c?c.replyGroup:"";
  if(rg){for(var i=0;i<GROUPS.length;i++){if(GROUPS[i].name===rg){pool=GROUPS[i].items;break;}}}
  if(pool.length===0){for(var i=0;i<GROUPS.length;i++)pool=pool.concat(GROUPS[i].items);}
  if(pool.length===0)return "……";
  return pool[Math.floor(Math.random()*pool.length)];
}
function getRandomCards(min,max){
  if(!min)min=2;if(!max)max=5;
  var count=min+Math.floor(Math.random()*(max-min+1));
  var cards=[],used={};
  for(var i=0;i<count;i++){var card=getRandomCard();if(used[card]){i--;continue;}used[card]=true;cards.push(card);}
  return cards.join("；");
}
function triggerReply(){
  clearTimeout(replyTimer);
  var c=getActiveChar();
  var delay=(c?c.replyDelay:3)||3;
  if(c&&c.replyUnit==="m")delay*=60;
  delay*=1000;
  var replyChar=c,senderName="partner";
  if(c&&c.isGroup&&c.members&&c.members.length>0){
    var pool=[];for(var gi=0;gi<characters.length;gi++){if(!characters[gi].isGroup&&c.members.indexOf(characters[gi].id)>=0)pool.push(characters[gi]);}
    if(pool.length>0){replyChar=pool[Math.floor(Math.random()*pool.length)];senderName=replyChar.name;}
  }
  showTyping(replyChar);
  replyTimer=setTimeout(function(){
    hideTyping();
    var roll=Math.random();
    if(roll<0.2&&customEmojis.length>0){
      addMessage("emoji",customEmojis[Math.floor(Math.random()*customEmojis.length)].data,senderName);
    }else if(roll<0.35){
      var yw=GROUPS.find(function(g){return g.name==="颜文字";});
      if(yw&&yw.items.length>0)addMessage("text",yw.items[Math.floor(Math.random()*yw.items.length)],senderName);
      else addMessage("text",getRandomCard(),senderName);
    }else{
      if(replyChar&&replyChar.chatHistory&&replyChar.chatHistory.length>0&&Math.random()<0.3){
        var lm=null;
        for(var i=replyChar.chatHistory.length-1;i>=0;i--){if(replyChar.chatHistory[i].sender==="me"){lm=replyChar.chatHistory[i];break;}}
        if(lm&&lm.type==="text"){addMessage("text","> 我: "+lm.content+"\n"+getRandomCard(),senderName);return;}
      }
      addMessage("text",getRandomCard(),senderName);
    }
  },delay);
}

function sendText(){
  var input=$("msg-input"),text=input.value.trim();
  if(!text)return;
  addMessage("text",text,"me");
  input.value="";input.style.height="auto";
  triggerReply();
}
function sendImage(file){
  var reader=new FileReader();
  reader.onload=function(e){compressImage(e.target.result,400,400,function(c){addMessage("image",c,"me");triggerReply();});};
  reader.readAsDataURL(file);
}

function openEmojiPanel(){$("emoji-panel").classList.add("open");emojiPanelOpen=true;renderEmojiContent();$("emoji-btn").classList.add("active");}
function closeEmojiPanel(){$("emoji-panel").classList.remove("open");emojiPanelOpen=false;$("emoji-btn").classList.remove("active");}
function toggleEmojiPanel(){if(emojiPanelOpen)closeEmojiPanel();else openEmojiPanel();}
function deleteEmoji(idx){customEmojis.splice(idx,1);dbSet("zk-emoji-library",customEmojis,function(){renderEmojiContent();});}
function sendEmoji(content){addMessage("emoji",content,"me");closeEmojiPanel();triggerReply();}
function renderEmojiContent(){
  var at=document.querySelector(".emoji-tab.active"),tab=at?at.dataset.tab:"yanwenzi";
  var content=$("emoji-content");
  if(tab==="yanwenzi"){
    var yw=GROUPS.find(function(g){return g.name==="颜文字";}),items=yw?yw.items:[];
    var html='<div class="emoji-grid">';
    for(var i=0;i<items.length;i++)html+='<div class="emoji-item" data-emoji="'+items[i].replace(/"/g,"&quot;")+'">'+items[i]+'</div>';
    html+='</div>';content.innerHTML=html;
  }else{
    var html='<div class="emoji-grid">';
    for(var i=0;i<customEmojis.length;i++)html+='<div class="emoji-item emoji-image" style="position:relative" data-eidx="'+i+'"><img src="'+customEmojis[i].data+'"><span class="emoji-del">✕</span></div>';
    html+='<div class="emoji-item emoji-add" id="emoji-add-btn">＋</div></div>';
    content.innerHTML=html;
    var ab=$("emoji-add-btn");if(ab)ab.addEventListener("click",function(){$("emoji-batch-input").click();});
  }
}
function uploadEmojis(files){
  if(!files||files.length===0)return;
  var total=files.length,loaded=0,failed=0;
  for(var i=0;i<files.length;i++){
    (function(file){
      if(!file.type.match(/^image\//)){failed++;return;}
      var r=new FileReader();
      r.onload=function(e){compressImage(e.target.result,120,120,0.5,function(c){customEmojis.push({id:Date.now(),data:c,name:file.name});loaded++;checkDone();});};
      r.onerror=function(){failed++;checkDone();};
      r.readAsDataURL(file);
    })(files[i]);
  }
  function checkDone(){if(loaded+failed===total){dbSet("zk-emoji-library",customEmojis,function(){renderEmojiContent();});toast("已添加 "+loaded+" 个"+(failed>0?", 跳过 "+failed+" 个":""));}}
}

function openCall(){
  if(callActive){toast("已在通话中");return;}
  callActive=true;
  var ca=document.getElementById("call-answer-btn"),cd=document.getElementById("call-decline-btn");
  if(ca)ca.style.display="none";if(cd)cd.style.display="none";
  var c=getActiveChar();
  $("call-status").textContent="呼叫中…";$("call-status").style.display="block";
  $("call-timer").style.display="none";$("call-bubbles").innerHTML="";
  $("call-overlay").classList.add("open");
  setTimeout(function(){
    var roll=Math.random();
    if(roll<0.1){$("call-status").textContent="无人接听";setTimeout(function(){hangupCall();},1500);return;}
    else if(roll<0.2){$("call-status").textContent="对方已挂断";var c2=getActiveChar();if(c2){c2.chatHistory.push({id:Date.now(),type:"text",content:"📞 未接通话",sender:"partner",time:Date.now()});saveAll();renderChat();}setTimeout(function(){hangupCall();},1500);return;}
    $("call-status").textContent="通话中";callSeconds=0;
    $("call-timer").style.display="block";updateCallTimer();
    callTimer=setInterval(updateCallTimer,1000);
    function showBubble(){var card=getRandomCard(),b=document.createElement("div");b.className="call-bubble";b.textContent=card;$("call-bubbles").appendChild(b);if($("call-bubbles").children.length>4)$("call-bubbles").firstChild.remove();}
    showBubble();callBubbleInterval=setInterval(showBubble,3000+Math.random()*3000);
  },2000+Math.random()*2000);
}
function updateCallTimer(){callSeconds++;var m=Math.floor(callSeconds/60),s=callSeconds%60;var ts=(m<10?"0"+m:m)+":"+(s<10?"0"+s:s);$("call-timer").textContent=ts;}
function hangupCall(){callActive=false;clearInterval(callTimer);clearInterval(callBubbleInterval);$("call-overlay").classList.remove("open");toast("通话结束");}
function incomingCall(){
  if(callActive)return;callActive=true;
  var c=getActiveChar();
  $("call-status").textContent="来电…";$("call-status").style.display="block";
  $("call-timer").style.display="none";$("call-bubbles").innerHTML="";

function checkPendingReplies(){

}

  for(var i=0;i<GROUPS.length;i++)groupOpts+='<option value="'+GROUPS[i].name.replace(/"/g,"&quot;")+'"'+((c.replyGroup===GROUPS[i].name)?" selected":"")+'>'+GROUPS[i].name+'</option>';
  var h="";
  h+='<h3>⚙️ 设置 - '+escapeHtml(c.name)+'</h3>';
  h+='<label>梦角名称</label><input type="text" id="set-name" value="'+escapeHtml(c.name)+'">';
  if(c.isGroup){h+='<label>群聊成员</label><div id="set-group-members" style="max-height:120px;overflow-y:auto;margin-bottom:4px"></div>';}
  h+='<label>我的名称</label><input type="text" id="set-myname" value="'+escapeHtml(settings.myName||"我")+'">';
  h+='<label>回复来源分组</label><select id="set-group">'+groupOpts+'</select>';
  h+='<label>回复延迟</label><div class="delay-row"><input type="number" id="set-delay" value="'+c.replyDelay+'" min="1"><select id="set-unit"><option value="s"'+(c.replyUnit==="s"?" selected":"")+'>秒</option><option value="m"'+(c.replyUnit==="m"?" selected":"")+'>分</option></select></div>';
  h+='<label>聊天背景</label><div style="display:flex;gap:6px"><input type="text" id="set-bg" value="'+escapeHtml(settings.chatBg||"")+'" placeholder="颜色或留空" style="flex:1"><button class="btn btn-sm" id="set-bg-img-btn">选择图片</button></div><input type="file" id="set-bg-img-input" accept="image/*" style="display:none">';
  h+='<label>主题</label><div style="display:flex;gap:6px">';
  ["auto","dark","light"].forEach(function(v,i){h+='<button class="btn btn-sm sel-theme'+(settings.theme===v?" btn-accent":"")+'" data-v="'+v+'">'+["自动","暗色","亮色"][i]+'</button>';});
  h+='</div><label>强调色</label><div style="display:flex;gap:4px;flex-wrap:wrap">';
  [{v:"gold",l:"金",c:"#c5a47e"},{v:"blue",l:"蓝",c:"#7FA6CD"},{v:"purple",l:"紫",c:"#BB9EC7"},{v:"pink",l:"粉",c:"#F4A6B3"},{v:"mono",l:"墨",c:"#888"},{v:"sunset",l:"橙",c:"#FF9A8B"}].forEach(function(x){h+='<button class="btn btn-sm sel-color'+(settings.color===x.v?" btn-accent":"")+'" data-v="'+x.v+'"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+x.c+';margin-right:3px"></span>'+x.l+'</button>';});
  h+='</div><div class="btn-row" style="flex-wrap:wrap;margin-top:12px">';
  h+='<button class="btn btn-sm" id="set-add-cards-btn">+ 新增字卡</button><button class="btn btn-sm" id="set-backup-btn">备份</button><button class="btn btn-sm" id="set-restore-btn">恢复</button><input type="file" id="set-restore-input" accept=".json" style="display:none">';
  h+='<button class="btn btn-sm" id="set-export-cards-btn">导出字卡</button><button class="btn btn-sm" id="set-import-cards-btn">导入字卡</button><input type="file" id="set-import-cards-input" accept=".json" style="display:none">';
  h+='<button class="btn btn-sm btn-danger" id="set-clear-btn">清空聊天</button><button class="btn btn-sm btn-danger" id="set-clear-emoji-btn">清空表情</button>';
  h+='<button class="btn btn-accent btn-sm" id="set-close-btn">完成</button></div>';
  panel.innerHTML=h;
  overlay.classList.add("open");

  if(c.isGroup){var gm=document.getElementById("set-group-members");if(gm){var mh="";for(var i=0;i<characters.length;i++){var ch=characters[i];if(ch.isGroup)continue;var inG=(c.members||[]).indexOf(ch.id)>=0;mh+='<label style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:13px;cursor:pointer"><input type="checkbox" class="gm-check" data-cid="'+ch.id+'"'+(inG?" checked":"")+'>'+escapeHtml(ch.name)+'</label>';}gm.innerHTML=mh;}}

  panel.querySelector(".sel-theme:nth-child(1)").parentElement.onclick=function(e){var b=e.target.closest(".sel-theme");if(!b)return;settings.theme=b.dataset.v;applyTheme();saveAll();panel.querySelectorAll(".sel-theme").forEach(function(tb){tb.classList.toggle("btn-accent",tb.dataset.v===settings.theme);});};
  panel.querySelector(".sel-color:nth-child(1)").parentElement.onclick=function(e){var b=e.target.closest(".sel-color");if(!b)return;settings.color=b.dataset.v;applyColor();saveAll();panel.querySelectorAll(".sel-color").forEach(function(cb){cb.classList.toggle("btn-accent",cb.dataset.v===settings.color);});};

  var bgBtn=$("set-bg-img-btn"),bgInp=$("set-bg-img-input");
  if(bgBtn&&bgInp){bgBtn.onclick=function(){bgInp.click();};bgInp.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){compressImage(ev.target.result,800,600,0.5,function(c){$("set-bg").value=c;toast("背景已选");});};r.readAsDataURL(f);e.target.value="";};}

  $("set-close-btn").onclick=function(){
    c.name=$("set-name").value.trim()||"梦角";
    if(c.isGroup){c.members=[];var cs=document.querySelectorAll(".gm-check");for(var i=0;i<cs.length;i++){if(cs[i].checked)c.members.push(cs[i].dataset.cid);}}
    settings.myName=$("set-myname").value.trim()||"我";settings.chatBg=$("set-bg").value.trim();applyChatBg();
    c.replyGroup=$("set-group").value;c.replyDelay=parseInt($("set-delay").value)||3;c.replyUnit=$("set-unit").value;
    saveAll();updateHeader();overlay.classList.remove("open");toast("设置已保存");
  };
  $("set-clear-btn").onclick=function(){if(!confirm("清空聊天？"))return;c.chatHistory=[];saveAll();renderChat();overlay.classList.remove("open");toast("已清空");};
  $("set-clear-emoji-btn").onclick=function(){if(!confirm("清空表情？"))return;customEmojis=[];dbSet("zk-emoji-library",[],function(){toast("已清空");});overlay.classList.remove("open");};
  $("set-add-cards-btn").onclick=function(){overlay.classList.remove("open");openAddCards();};
  $("set-backup-btn").onclick=function(){var bk={version:2,date:new Date().toISOString(),cards:GROUPS,characters:characters,activeCharId:activeCharId,emojiLibrary:customEmojis,settings:settings};downloadJSON(bk,"备份_"+new Date().toISOString().slice(0,10)+".json");};
  $("set-restore-btn").onclick=function(){$("set-restore-input").click();};
  $("set-restore-input").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{var b=JSON.parse(ev.target.result);if(!b.cards||!confirm("恢复覆盖数据？"))return;GROUPS.length=0;for(var i=0;i<b.cards.length;i++)GROUPS.push(b.cards[i]);if(b.characters){characters=b.characters;activeCharId=b.activeCharId||characters[0].id;}customEmojis=b.emojiLibrary||[];if(b.settings)settings=b.settings;saveAll();localStorage.setItem("zk-card-data",JSON.stringify(GROUPS));applyTheme();applyColor();updateHeader();renderChat();overlay.classList.remove("open");toast("已恢复");}catch(err){toast("解析失败");}};r.readAsText(f);e.target.value="";};
  $("set-export-cards-btn").onclick=function(){var ed={exportDate:new Date().toISOString(),modules:["replies","groups"],customReplies:GROUPS.reduce(function(a,g){return a.concat(g.items)},[]),customReplyGroups:GROUPS,_groupExport:true,_groupExportType:"replies"};downloadJSON(ed,"字卡导出.json");};
  $("set-import-cards-btn").onclick=function(){$("set-import-cards-input").click();};
  $("set-import-cards-input").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{var d=JSON.parse(ev.target.result);var gs=d.customReplyGroups||[];if(!gs.length){toast("无分组");return;}showCardImportDialog(gs);}catch(err){toast("格式错误");}};r.readAsText(f);e.target.value="";};
}

function showCardImportDialog(groups){
  var overlay=$("import-overlay"),panel=$("import-panel");
  var total=groups.reduce(function(s,g){return s+(g.items||[]).length},0);
  panel.innerHTML='<h3>📥 导入字卡</h3><p>检测到 <strong>'+groups.length+'</strong> 个分组，共 <strong>'+total+'</strong> 条</p><div style="display:flex;gap:8px;justify-content:center;margin-top:16px"><button class="btn btn-accent" id="import-replace-btn">覆盖导入</button><button class="btn" id="import-append-btn">追加导入（去重）</button><button class="btn" id="import-cancel-btn">取消</button></div>';
  overlay.classList.add("open");
  function close(){overlay.classList.remove("open");}
  $("import-cancel-btn").onclick=close;
  $("import-replace-btn").onclick=function(){if(!confirm("覆盖当前字卡库？"))return;GROUPS.length=0;for(var i=0;i<groups.length;i++)GROUPS.push({name:groups[i].name,color:groups[i].color||"#888",items:(groups[i].items||[]).slice()});localStorage.setItem("zk-card-data",JSON.stringify(GROUPS));close();toast("已覆盖");};
  $("import-append-btn").onclick=function(){var added=0;for(var i=0;i<groups.length;i++){var g=groups[i],ex=GROUPS.find(function(eg){return eg.name===g.name;});if(ex){var es={};for(var k=0;k<ex.items.length;k++)es[ex.items[k]]=true;for(var j=0;j<(g.items||[]).length;j++){if(!es[g.items[j]]){ex.items.push(g.items[j]);es[g.items[j]]=true;added++;}}}else{GROUPS.push({name:g.name,color:g.color||"#888",items:(g.items||[]).slice()});added+=(g.items||[]).length;}}localStorage.setItem("zk-card-data",JSON.stringify(GROUPS));close();toast("追加完成，新增 "+added+" 条（已去重）");};
}

function openAddCards(){
  var overlay=$("import-overlay"),panel=$("import-panel");
  var gOpts="";for(var i=0;i<GROUPS.length;i++)gOpts+='<option value="'+GROUPS[i].name.replace(/"/g,"&quot;")+'">'+GROUPS[i].name+' ('+GROUPS[i].items.length+'条)</option>';
  panel.innerHTML='<h3>＋ 新增字卡</h3><label>选择分组</label><select id="add-group">'+gOpts+'</select><label>或新建分组</label><input type="text" id="add-new-group" placeholder="新分组名"><label>字卡内容（一行一条）</label><textarea id="add-cards-text" placeholder="粘贴字卡…"></textarea><div class="btn-row"><button class="btn" id="add-cancel-btn">取消</button><button class="btn btn-accent btn-sm" id="add-confirm-btn">确认添加</button></div>';
  overlay.classList.add("open");
  $("add-cancel-btn").onclick=function(){overlay.classList.remove("open");};
  $("add-confirm-btn").onclick=function(){
    var lines=$("add-cards-text").value.split("\n").map(function(l){return l.trim();}).filter(Boolean);
    if(lines.length===0){toast("请输入内容");return;}
    var gn=$("add-new-group").value.trim()||$("add-group").value;
    if(!gn){toast("请选择或输入分组");return;}
    var g=GROUPS.find(function(g2){return g2.name===gn;});
    if(!g){var cols=["#FFC542","#20C997","#FF6B6B","#51CF66","#FF8E53","#4DABF7","#5C7CFA"];g={name:gn,color:cols[GROUPS.length%cols.length],items:[]};GROUPS.push(g);}
    var es={},added=0;for(var i=0;i<g.items.length;i++)es[g.items[i]]=true;
    for(var i=0;i<lines.length;i++){if(!es[lines[i]]){g.items.push(lines[i]);es[lines[i]]=true;added++;}}
    localStorage.setItem("zk-card-data",JSON.stringify(GROUPS));toast("已添加 "+added+" 条，跳过 "+(lines.length-added)+" 条重复");$("add-cards-text").value="";
  };
}

function downloadJSON(data,filename){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);toast("已下载 "+filename);
}

// ===== NAV =====
function setActiveNav(el){document.querySelectorAll(".nav-item").forEach(function(n){n.classList.remove("active");});el.classList.add("active");}

// ===== EVENTS =====
function bindEvents(){
  // Send
  $("send-btn").addEventListener("click",sendText);
  $("msg-input").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendText();}});
  $("msg-input").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,100)+"px";});
  // Image, Survey, Emoji
  $("image-btn").addEventListener("click",function(){$("image-input").click();});
  $("image-input").addEventListener("change",function(e){var f=e.target.files[0];if(f){sendImage(f);e.target.value="";}});
  $("survey-btn").addEventListener("click",openSurvey);
  $("emoji-btn").addEventListener("click",toggleEmojiPanel);
  $("emoji-batch-input").addEventListener("change",function(){uploadEmojis(this.files);});
  // Emoji panel clicks
  $("emoji-panel").addEventListener("click",function(e){
    var tab=e.target.closest(".emoji-tab");if(tab){document.querySelectorAll(".emoji-tab").forEach(function(t){t.classList.toggle("active",t===tab);});renderEmojiContent();return;}
    var del=e.target.closest(".emoji-del");if(del){e.stopPropagation();var p=del.closest(".emoji-item");if(p&&p.dataset.eidx!==undefined)deleteEmoji(parseInt(p.dataset.eidx));return;}
    var item=e.target.closest(".emoji-item");if(item){
      if(item.dataset.eidx!==undefined){var ei=parseInt(item.dataset.eidx);if(customEmojis[ei])sendEmoji(customEmojis[ei].data);return;}
      if(item.dataset.emoji){sendEmoji(item.dataset.emoji);return;}
    }
  });

  // Nav
  var nc=document.getElementById("nav-chat");if(nc)nc.addEventListener("click",function(){setActiveNav(this);});
  var nm=document.getElementById("nav-mail");if(nm)nm.addEventListener("click",function(){setActiveNav(this);openMailbox();});
  var ncl=document.getElementById("nav-call");if(ncl)ncl.addEventListener("click",function(){setActiveNav(this);openCall();});
  var nrp=document.getElementById("nav-redpack");if(nrp)nrp.addEventListener("click",function(){setActiveNav(this);openRedpack("to");});
  var nmo=document.getElementById("nav-moments");if(nmo)nmo.addEventListener("click",function(){setActiveNav(this);openMoments();maybeAutoPost();});
  var ns=document.getElementById("nav-settings");if(ns)ns.addEventListener("click",function(){setActiveNav(this);openSettings();});

  // Character dropdown
  $("header-info").addEventListener("click",function(e){e.stopPropagation();toggleCharDropdown();});
  $("char-dropdown").addEventListener("click",function(e){
    var item=e.target.closest(".char-item");if(!item)return;
    var cid=item.dataset.cid;if(cid){switchCharacter(parseInt(cid));return;}
    var del=e.target.closest(".char-item-del");if(del){deleteCharacter(parseInt(del.dataset.del));return;}
    if(item.id==="char-add-btn"){addCharacter();return;}
  });
  document.addEventListener("click",function(){$("char-dropdown").classList.remove("open");});

  // Chat area: redpack + quote
  $("chat-area").addEventListener("click",function(e){
    var accept=e.target.closest(".rp-accept-btn"),reject=e.target.closest(".rp-reject-btn");
    if(accept||reject){
      e.stopPropagation();var rid=parseInt((accept||reject).dataset.rid);var c=getActiveChar();if(!c)return;
      for(var i=0;i<c.chatHistory.length;i++){
        if(c.chatHistory[i].id===rid){
          if(accept){c.chatHistory[i].status="accepted";c.chatHistory[i].reply=getRandomCard();addMessage("text","谢谢宝贝的红包~ "+c.chatHistory[i].reply,"me");}
          else{c.chatHistory[i].status="rejected";addMessage("text","红包已退还","me");}
          saveAll();renderChat();break;
        }
      }return;
    }
    var bubble=e.target.closest(".msg-bubble");
    if(bubble){
      var row=bubble.closest(".msg-row");if(!row)return;
      var clone=bubble.cloneNode(true);clone.querySelectorAll("button").forEach(function(b){b.remove();});
      var text=clone.textContent.trim();if(!text)return;
      var c2=getActiveChar(),sender=row.classList.contains("me")?(settings.myName||"我"):(c2?c2.name:"对方");
      $("msg-input").value="> "+sender+": "+text+"\n";$("msg-input").focus();
      $("msg-input").style.height="auto";$("msg-input").style.height=Math.min($("msg-input").scrollHeight,100)+"px";
    }
  });
  $("chat-area").addEventListener("scroll",function(){var a=this,b=$("scroll-bottom-btn");if(a.scrollHeight-a.scrollTop-a.clientHeight>200)b.classList.add("show");else b.classList.remove("show");});
  $("scroll-bottom-btn").addEventListener("click",scrollToBottom);

  // Overlay close handlers
  $("mail-overlay").addEventListener("click",function(e){if(e.target===this)this.classList.remove("open");});
  $("settings-overlay").addEventListener("click",function(e){if(e.target===this)this.classList.remove("open");});
  $("import-overlay").addEventListener("click",function(e){if(e.target===this)this.classList.remove("open");});
  $("survey-overlay").addEventListener("click",function(e){if(e.target===this)this.classList.remove("open");});

  // Redpack overlay
  $("redpack-overlay").addEventListener("click",function(e){if(e.target===this)this.classList.remove("open");});

  // Moments
  $("moments-back-btn").addEventListener("click",function(){$("moments-overlay").classList.remove("open");});
  $("moments-send-btn").addEventListener("click",function(){
    var text=$("moments-input").value.trim(),img=momentsPendingImg;
    if(!text&&!img){toast("请输入内容");return;}
    postMoment(text,img,"我");$("moments-input").value="";momentsPendingImg=null;
    $("moments-img-btn").textContent="🖼️";$("moments-img-btn").style.borderColor="";$("moments-img-btn").style.color="";
    var c=getActiveChar();setTimeout(function(){postMoment(getRandomCards(2,4),null,c.name);},3600000+Math.random()*3600000);
  });
  $("moments-img-btn").addEventListener("click",function(){$("moments-img-input").click();});
  $("moments-img-input").addEventListener("change",function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(ev){momentsPendingImg=ev.target.result;$("moments-img-btn").textContent="🖼️✓";$("moments-img-btn").style.borderColor="rgba(var(--accent-rgb),.5)";$("moments-img-btn").style.color="var(--accent)";toast("图片已选择");};r.readAsDataURL(f);e.target.value="";
  });

  // System theme change
  window.matchMedia("(prefers-color-scheme:dark)").addEventListener("change",function(){if(settings.theme==="auto")applyTheme();});

  // Keyboard
  document.addEventListener("keydown",function(e){
    if((e.ctrlKey||e.metaKey)&&e.key==="k"){e.preventDefault();$("msg-input").focus();}
    if(e.key==="Escape"){$("settings-overlay").classList.remove("open");$("mail-overlay").classList.remove("open");$("import-overlay").classList.remove("open");$("survey-overlay").classList.remove("open");}
  });
}

// ===== START =====
init();
</script>
